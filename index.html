// 🎲 UTILIDADE DE SORTEIO

function sortear(lista) {
    return lista[Math.floor(Math.random() * lista.length)];
}


// =============================
// 🔤 NORMALIZAÇÃO FORTE
// =============================
function normalizarTexto(texto) {
    return texto
        .toLowerCase()
        .normalize("NFD") // remove acento
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^\w\s]/g, "") // remove pontuação
        .replace(/\s+/g, "") // REMOVE TODOS ESPAÇOS
        .trim();
}

// =============================
// 🔍 BUSCAR OU CRIAR CONCEITO
// =============================
async function buscarOuCriarConceito(textoOriginal) {

    const termo_normalizado = normalizarTexto(textoOriginal);

    // tenta buscar
    let { data: existente } = await _supabase
        .from("conceitos")
        .select("*")
        .eq("termo_normalizado", termo_normalizado)
        .maybeSingle();

    if (existente) {
        return existente;
    }

    // se não existe → cria (UPSERT manual seguro)
    const { data, error } = await _supabase
        .from("conceitos")
        .insert({
            termo: textoOriginal,
            termo_normalizado
        })
        .select()
        .single();

    if (error) {
        // possível corrida → tenta buscar novamente
        const { data: retry } = await _supabase
            .from("conceitos")
            .select("*")
            .eq("termo_normalizado", termo_normalizado)
            .single();

        return retry;
    }

    return data;
}

// =============================
// 📥 BUSCAR RESPOSTAS DO CONCEITO
// =============================
async function buscarRespostas(conceito_id) {

    const { data, error } = await _supabase
        .from("respostas")
        .select("*")
        .eq("conceito_id", conceito_id);

    if (error) {
        console.error("Erro ao buscar respostas:", error);
        return [];
    }

    return data;
}

// =============================
// 💾 SALVAR RESPOSTA (SEM DUPLICAR)
// =============================
async function salvarResposta(conceito_id, textoOriginal) {

    const texto_normalizado = normalizarTexto(textoOriginal);

    // verifica se já existe
    const { data: existente } = await _supabase
        .from("respostas")
        .select("*")
        .eq("conceito_id", conceito_id)
        .eq("texto_normalizado", texto_normalizado)
        .maybeSingle();

    if (existente) {
        // soma +1
        const novaQuantidade = parseFloat(existente.quantidade) + 1;

        await _supabase
            .from("respostas")
            .update({ quantidade: novaQuantidade })
            .eq("id", existente.id);

        return;
    }

    // cria nova resposta
    await _supabase
        .from("respostas")
        .insert({
            conceito_id,
            texto: textoOriginal,
            texto_normalizado,
            quantidade: 1
        });
}

function addMsg(texto, classe) {

    div.textContent = texto;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;

// =============================
// 🧠 PROCESSAMENTO PRINCIPAL (SEM 80/10/10)
// =============================
btn.onclick = enviar;
input.addEventListener("keypress", e => {
    if (e.key === "Enter") enviar();
});

async function enviar() {

    const texto = input.value.trim();
    if (!texto) return;

    addMsg(texto, "user");
    input.value = "";

    // =========================
    // 🔁 MODO APRENDER
    // =========================
    if (modoAprender && termoPendente) {

        await salvarResposta(termoPendente.id, texto);

        // resposta aprendida
        addMsg(sortear(VOCABULARIO.aprendeu), "ba");

        modoAprender = false;
        termoPendente = null;

        return;
    }

    // =========================
    // 🔍 BUSCA CONCEITO
    // =========================
    const conceito = await buscarOuCriarConceito(texto);
    const respostas = await buscarRespostas(conceito.id);

    ultimoConceito = conceito;

    // =========================
    // ❓ NÃO TEM RESPOSTA
    // =========================
    if (respostas.length === 0) {

        modoAprender = true;
        termoPendente = conceito;

        addMsg(sortear(VOCABULARIO.naoSabe), "ba");
        return;
    }

    // =========================
    // 📊 ESCOLHER RESPOSTA DOMINANTE
    // =========================
    let respostaEscolhida = escolherRespostaDominante(respostas);

    // =========================
    // 🔄 OPÇÃO B — ATUALIZA TEXTO MAIS FREQUENTE
    // =========================
    await atualizarTextoMaisFrequente(respostaEscolhida);

    // =========================
    // 💾 APRENDIZADO PASSIVO (SOMA RESPOSTA DO USUÁRIO)
    // =========================
    await salvarResposta(conceito.id, texto);

    // =========================
    // 📤 RESPONDE
    // =========================
    addMsg(respostaEscolhida.texto, "ba");
}

// =============================
// 🧠 ESCOLHER RESPOSTA DOMINANTE
// =============================
function escolherRespostaDominante(respostas) {

    // ordena por quantidade
    respostas.sort((a, b) => b.quantidade - a.quantidade);

    const maior = respostas[0].quantidade;

    // pega todas empatadas
    const empatadas = respostas.filter(r => r.quantidade === maior);

    // desempate aleatório
    return empatadas[Math.floor(Math.random() * empatadas.length)];
}

// =============================
// 🔄 ATUALIZAR TEXTO MAIS FREQUENTE (OPÇÃO B)
// =============================
async function atualizarTextoMaisFrequente(resposta) {

    // garante que o texto salvo representa a forma dominante
    await _supabase
        .from("respostas")
        .update({ texto: resposta.texto })
        .eq("id", resposta.id);
}
